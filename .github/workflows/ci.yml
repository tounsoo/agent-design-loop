name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check:target-size, check:accessible-names, check:rendered-page and the fixture cases that open a page run in the chrome-headless-shell build puppeteer-core pins, the same build npm run setup:chrome installs locally.
      - uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run setup:chrome
      # The harness's fixtures, the repository-wide checks, then the proposals and retirement checks across every product, the design loop graph and the generated check reference.
      # Each product's rule checks run in the product jobs below.
      # Last, the change's loop trace, which is not part of the build gate: the agent runs the gate in the middle of its walk, before the trace ends.
      - run: npm run check:fixtures && npm run typecheck && npm run lint && npm run test && npm run check:proposals && npm run check:retirement && npm run check:loop && npm run check:docs && npm run check:trace
        env:
          INVENTORY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  # The product registry: every harness.config.ts outside the harness package, as npm run check:products finds them.
  # Nothing here names a product, so a new one gets its job by existing.
  products:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.registry.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # On its own line, so a failure fails the step instead of writing an empty list.
      - id: registry
        run: |
          configs=$(npm run --silent check:products -- --json)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  # One job per product runs every rule check on its config, as npm run check:products does locally one after another.
  # Typecheck, ESLint and the Vitest suite cover every product in the check job.
  product:
    needs: products
    name: product (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.products.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run setup:chrome
      - run: npm run check:product -- --config "$CONFIG"
        env:
          CONFIG: ${{ matrix.config }}
          INVENTORY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
