name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check:target-size and check:accessible-names run in the chrome-headless-shell build puppeteer-core pins, the same build npm run setup:chrome installs locally.
      - uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run setup:chrome
      # The harness's fixtures, the repository-wide checks, Meridian's rule checks, then the proposals and retirement checks across every product, the design loop graph and the generated check reference.
      # Last, the change's loop trace, which is not part of the build gate: the agent runs the gate in the middle of its walk, before the trace ends.
      - run: npm run check:fixtures && npm run typecheck && npm run lint && npm run test && npm run check:product -- --config products/meridian/harness.config.ts && npm run check:proposals && npm run check:retirement && npm run check:loop && npm run check:docs && npm run check:trace
        env:
          INVENTORY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  # Nook, the second product, runs every rule check on its own config.
  # Typecheck, ESLint and the Vitest suite cover it in the check job.
  # Locally, npm run check runs both products. CI splits them into two jobs.
  nook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check:target-size and check:accessible-names run in the chrome-headless-shell build puppeteer-core pins, the same build npm run setup:chrome installs locally.
      - uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run setup:chrome
      - run: npm run check:product -- --config products/nook/harness.config.ts
        env:
          INVENTORY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
