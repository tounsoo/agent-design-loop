<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Legal: chrome controls, and the links in a closed chrome menu, of 32 CSS px around the page</title>
  </head>
  <body>
    <nav>
      <a href="#help" style="display: inline-block; width: 32px; height: 32px; overflow: hidden">Help</a>
      <a href="#search" style="display: inline-block; width: 32px; height: 32px; overflow: hidden">Search</a>
      <details>
        <summary style="display: block; width: 120px; height: 32px">Preview</summary>
        <a href="#ready" style="display: inline-block; width: 32px; height: 32px; overflow: hidden">Ready</a>
        <a href="#error" style="display: inline-block; width: 32px; height: 32px; overflow: hidden">Error</a>
      </details>
    </nav>
    <main data-page="detail">
      <details>
        <summary style="display: block; width: 120px; height: 32px">Line items</summary>
        <p>Paper stock</p>
      </details>
      <button type="button" style="width: 120px; height: 40px">Approve</button>
    </main>
  </body>
</html>
