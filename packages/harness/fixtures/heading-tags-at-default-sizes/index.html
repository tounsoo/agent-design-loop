<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal: proper heading tags at the design system's own sizes</title>
  </head>
  <body style="margin: 0; font-family: sans-serif">
    <main data-page="detail">
      <h1 style="font-size: 30px">Northwind Office Supply</h1>
      <h2 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Status</h2>
      <p>Approved by Dana on Nov 3.</p>
      <div>
        <h2 style="font-size: 24px">Vendor</h2>
        <p>Remit to accounts@northwind.example</p>
        <ul style="list-style: none; padding: 0">
          <li><h3 style="font-size: 20px">Primary contact</h3><p>Dana Lee</p></li>
        </ul>
        <div style="border: 1px solid #cccccc; padding: 12px">
          <h2 style="font-size: 24px">Activity</h2>
          <h3 style="font-size: 20px">Comments</h3>
          <h4 style="font-size: 16px">Nov 3</h4>
          <p>Approved.</p>
        </div>
        <h2 style="font-size: 24px">Line items</h2>
        <h4 aria-level="3" style="font-size: 20px">Paper stock</h4>
        <h5 role="presentation" style="font-size: 12px">Ships in 2 days</h5>
        <p>Paper stock and toner.</p>
      </div>
      <button type="button" style="width: 120px; height: 40px">Approve</button>
    </main>
  </body>
</html>
