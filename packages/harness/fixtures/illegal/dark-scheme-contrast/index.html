<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illegal: text that turns light in the dark scheme on a page that stays white</title>
    <style>
      body { margin: 0; font-family: sans-serif; color: #1a1a1a; }
      @media (prefers-color-scheme: dark) {
        body { color: #eeeeee; }
      }
    </style>
  </head>
  <body>
    <main data-page="detail">
      <h1 style="font-size: 30px">Northwind Office Supply</h1>
      <p>Total due</p>
      <button type="button" style="width: 120px; height: 40px; color: #000000; background: #e0e0e0">Approve</button>
    </main>
  </body>
</html>
