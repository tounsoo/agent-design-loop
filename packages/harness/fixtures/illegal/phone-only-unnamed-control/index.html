<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Illegal: a menu button only a phone shows, with no name</title>
    <style>
      .menu-button { display: none; min-width: 24px; min-height: 24px; }
      @media (max-width: 600px) {
        .sidebar { display: none; }
        .menu-button { display: inline-block; }
      }
    </style>
  </head>
  <body>
    <nav class="sidebar" aria-label="Payables"><a href="/">To approve</a></nav>
    <button type="button" class="menu-button"><svg aria-hidden="true" width="16" height="16"><circle cx="8" cy="8" r="2" /></svg></button>
    <main>
      <h1>Northwind Office Supply</h1>
    </main>
  </body>
</html>
